name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck --version
      - name: Lint shell scripts
        run: shellcheck hooks/*.sh mimo install.sh uninstall.sh tests/helpers.bash

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + jq
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y bats jq
          else
            command -v bats >/dev/null 2>&1 || brew install bats-core
            command -v jq   >/dev/null 2>&1 || brew install jq
          fi
          bats --version
          jq --version
      - name: Run bats suite
        run: bats tests/

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y jq; else brew install jq; fi
          fi
          jq --version
      - name: Sandbox install → doctor → uninstall
        run: |
          set -euo pipefail
          REPO="$PWD"
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.claude"
          export PATH="$HOME/.local/bin:$PATH"

          # Install from the checked-out clone (local mode).
          bash "$REPO/install.sh"

          # Assert: 9 hook scripts, valid settings.json, versions stamped.
          count=$(find "$HOME/.claude/hooks" -name '*.sh' | wc -l | tr -d ' ')
          [ "$count" -eq 9 ] || { echo "expected 9 hooks, got $count"; exit 1; }
          jq empty "$HOME/.claude/settings.json"
          if grep -rq '__VERSION__' "$HOME/.claude/hooks"; then echo "unstamped __VERSION__ found"; exit 1; fi
          if grep -q '__VERSION__' "$HOME/.local/bin/mimo"; then echo "unstamped CLI"; exit 1; fi

          # Deep diagnostics must pass.
          mimo doctor

          # Uninstall and assert settings.json is cleaned of mimo.
          bash "$REPO/uninstall.sh"
          if [ -f "$HOME/.claude/settings.json" ]; then
            sl=$(jq -r '.statusLine.command // ""' "$HOME/.claude/settings.json")
            case "$sl" in *statusline-memory.sh*) echo "statusLine not cleaned"; exit 1 ;; esac
            if jq -e '[.hooks[]?[]?.hooks[]?.command // "" | select(contains("/.claude/hooks/"))] | length > 0' "$HOME/.claude/settings.json" >/dev/null; then
              echo "mimo hooks not cleaned from settings.json"; exit 1
            fi
          fi
          echo "e2e OK"
