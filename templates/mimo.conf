# mimo configuration — ~/.claude/mimo.conf
#
# Plain shell variable assignments, sourced by mimo's hooks and CLI at startup.
# Every key below is OPTIONAL: uncomment a line to override mimo's built-in
# default (shown as the value). Anything left commented uses the default.
#
# You do NOT need to edit the installed hooks in ~/.claude/hooks/ to customize
# mimo — and you shouldn't: hook edits are overwritten every time mimo updates.
# Change behavior here instead. This file is never overwritten by updates.

# Context % at which mimo triggers a checkpoint save.  (statusline-memory.sh)
#CHECKPOINT_THRESHOLD=50

# Context % at which mimo triggers a full save.  (statusline-memory.sh)
#FULLSAVE_THRESHOLD=80

# Width of the statusline progress bar, in characters.  (statusline-memory.sh)
#BAR_WIDTH=20

# When to auto-create CLAUDE.md / CLAUDE-FULL.md at session start.  (session-start.sh)
#   git-only  only inside a git working tree (default; covers worktrees + subdirs)
#   always    in any directory (your $HOME is always refused, regardless)
#   never     never auto-create; run `mimo init` manually where you want memory
#AUTO_INIT=git-only

# Include the opinionated "Workflow Orchestration" block in NEW CLAUDE.md files.
#   off  memory sections only (default)
#   on   also add the workflow guidance block (plan mode, subagents, etc.)
# (session-start.sh, mimo init — `mimo init --with-workflow` forces this on)
#WORKFLOW_BLOCK=off

# Delete transcript backups older than this many days.
# (session-end-backup.sh, mimo cleanup)
#BACKUP_RETENTION_DAYS=30

# A session with no StatusLine heartbeat in this many minutes is considered
# stale (crashed / force-quit) and eligible for cleanup.
# (session-start.sh cleanup, mimo status, mimo cleanup)
#STALE_MINUTES=120

# Arm a checkpoint save after this many file-change events since the last save,
# regardless of context %. Recurring — re-arms every N further changes. 0 = off.
# (statusline-memory.sh)
#SAVE_AFTER_CHANGES=40

# Inject ~/.claude/mimo-user.md (your cross-project user profile) into every
# session's context.  on = inject if the file exists (default); off = never
# inject (mimo never deletes the file).  (session-start.sh)
#USER_PROFILE=on
